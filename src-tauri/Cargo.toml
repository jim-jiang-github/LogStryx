[package]
name = "logstryx"
version = "0.1.0"
description = "A cross-platform log analysis workbench"
authors = ["Jim Jiang"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
rfd = "0.15"
regex = "1"
